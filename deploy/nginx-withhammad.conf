# /etc/nginx/sites-available/withhammad.conf
# Reverse proxy for the Next.js standalone server on :3000.
# certbot rewrites this file for SSL after `certbot --nginx` (DEPLOY.md §6).

server {
    listen 80;
    listen [::]:80;
    server_name withhammad.com www.withhammad.com;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Streaming endpoints (chat SSE + TTS audio): buffering off, or tokens
    # arrive in one lump at the end instead of streaming.
    location ~ ^/api/(chat|voice) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Immutable fingerprinted/static assets — includes narration MP3s.
    location ~ ^/(_next/static|fonts|models|hdri|audio)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
